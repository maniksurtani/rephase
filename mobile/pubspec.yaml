name: rephase
description: Offline jet lag planning for iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^17.0.1
  http: ^1.5.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/engine/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../public/icon-512.png
  remove_alpha_ios: true
  background_color_ios: '#10111a'
  adaptive_icon_background: '#10111a'
  adaptive_icon_foreground: ../public/icon-512.png
