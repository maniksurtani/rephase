name: Native runtime checks

# Widget-only changes use Mobile checks; these jobs exercise real platform hosts.
on:
  pull_request:
    paths:
      - 'mobile/lib/engine/**'
      - 'mobile/lib/data/models.dart'
      - 'mobile/lib/main.dart'
      - 'mobile/lib/rephase_app.dart'
      - 'mobile/android/**'
      - 'mobile/ios/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'mobile/integration_test/**'
      - 'mobile/test_driver/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'public/data-licenses/**'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'scripts/run-ios-runtime-test.mjs'
      - 'tests/ios-runtime-runner.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-runtime.yml'
      - '.github/actions/setup-flutter/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'mobile/lib/engine/**'
      - 'mobile/lib/data/models.dart'
      - 'mobile/lib/main.dart'
      - 'mobile/lib/rephase_app.dart'
      - 'mobile/android/**'
      - 'mobile/ios/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - 'mobile/integration_test/**'
      - 'mobile/test_driver/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'public/data-licenses/**'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'scripts/run-ios-runtime-test.mjs'
      - 'tests/ios-runtime-runner.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-runtime.yml'
      - '.github/actions/setup-flutter/**'
      - '!**/*.md'
  schedule:
    - cron: '23 4 * * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_apk:
        description: Also build and upload an installable Android debug APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  FLUTTER_REVISION: 'abaf9c523780a608bd46686fd5e53740a07077f8'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore Gradle dependencies and wrapper distributions
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the offline planning bundle in a browser
        run: node scripts/check-mobile-engine.mjs
      - uses: ./.github/actions/setup-flutter
        with:
          profile: android
          version: ${{ env.FLUTTER_VERSION }}
          revision: ${{ env.FLUTTER_REVISION }}
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build an installable debug APK
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_apk)
        run: flutter build apk --debug --no-pub
        working-directory: mobile
      - name: Preserve the installable app before building the integration host
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_apk)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rephase-android-debug-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Start an Android emulator for the native runtime check
        timeout-minutes: 6
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          runtime_logs="$RUNNER_TEMP/rephase-android-runtime"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/rephase-android-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$runtime_logs" "$ANDROID_AVD_HOME"
          image='system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$image" 2>&1 | tee "$runtime_logs/sdk-install.log"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name rephase-runtime --path "$ANDROID_AVD_HOME/rephase-runtime.avd" --package "$image" --device pixel_6 2>&1 | tee "$runtime_logs/avd-create.log"
          test -f "$ANDROID_AVD_HOME/rephase-runtime.ini"
          test -f "$ANDROID_AVD_HOME/rephase-runtime.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$runtime_logs/avd-list.log"
          grep -Fxq rephase-runtime "$runtime_logs/avd-list.log"
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd rephase-runtime -port 5554 -accel on -gpu swiftshader -no-window -no-audio -no-snapshot -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 > "$runtime_logs/emulator.log" 2>&1 &
      - name: Compile the Android runtime test
        run: flutter build apk --debug --no-pub --target=integration_test/offline_engine_test.dart
        working-directory: mobile
      - name: Wait for Android to finish booting
        timeout-minutes: 4
        shell: bash
        run: |
          boot_deadline=$((SECONDS + 180))
          until timeout 5 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q '^1'; do
            if (( SECONDS >= boot_deadline )); then
              echo 'The Android emulator did not finish booting within three minutes.' >&2
              exit 1
            fi
            sleep 3
          done
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell input keyevent 82
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -c
      - name: Verify the offline engine in Android WebView
        timeout-minutes: 8
        shell: bash
        working-directory: mobile
        run: |
          # This binary is only the integration host; never publish it as the app APK.
          flutter drive --no-dds --verbose --no-pub --driver=test_driver/integration_test.dart --target=integration_test/offline_engine_test.dart --use-application-binary=build/app/outputs/flutter-apk/app-debug.apk -d emulator-5554 2>&1 | tee "$RUNNER_TEMP/rephase-android-runtime/driver.log"
      - name: Capture Android runtime diagnostics and stop the emulator
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          runtime_logs="$RUNNER_TEMP/rephase-android-runtime"
          mkdir -p "$runtime_logs"
          timeout 15 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d -v threadtime > "$runtime_logs/logcat.log" 2>&1 || true
          timeout 15 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell dumpsys webviewupdate > "$runtime_logs/webview-provider.log" 2>&1 || true
          timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
      - name: Preserve Android runtime diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rephase-android-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rephase-android-runtime/
          if-no-files-found: warn
          retention-days: 14

  ios:
    # Standard macOS runners are free for this public repository. Build and run
    # the offline native engine test without provisioning, signing or publishing.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-mobile-engine.mjs
      - uses: ./.github/actions/setup-flutter
        with:
          profile: ios
          version: ${{ env.FLUTTER_VERSION }}
          revision: ${{ env.FLUTTER_REVISION }}
      - name: Cache iOS dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Download/repository caches only; compiled products and DerivedData
          # depend on runner/Xcode paths and are intentionally rebuilt.
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm/repositories
          key: ios-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_REVISION }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/ios/Podfile', 'mobile/ios/Runner.xcodeproj/project.pbxproj', 'mobile/ios/**/Package.resolved') }}
          restore-keys: ios-downloads-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_REVISION }}-
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Start an available iPhone simulator
        timeout-minutes: 2
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = [device for runtime, group in json.load(sys.stdin)["devices"].items()
                     if ".iOS-" in runtime for device in group
                     if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed")
          selected = next((device for device in devices if device["state"] == "Booted"), devices[0])
          print(selected["udid"])
          ')
          echo "REPHASE_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          # First boot migrates the runner's fresh simulator data. Overlap it with
          # compilation rather than spending the readiness budget on migration.
          xcrun simctl boot "$device_id" || xcrun simctl list devices booted | grep -F "$device_id"
          open -a Simulator --args -CurrentDeviceUDID "$device_id"
      - name: Compile the iOS runtime test without signing
        run: flutter build ios --simulator --debug --no-codesign --target=integration_test/offline_engine_test.dart
        working-directory: mobile
      - name: Wait for the iPhone simulator to finish booting
        timeout-minutes: 5
        run: |
          xcrun simctl bootstatus "$REPHASE_SIMULATOR_ID" -b
      - name: Verify the offline engine in WKWebView
        timeout-minutes: 14
        run: node scripts/run-ios-runtime-test.mjs --device "$REPHASE_SIMULATOR_ID" --log-dir "$RUNNER_TEMP/rephase-ios-runtime"
      - name: Preserve complete iOS runtime diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rephase-ios-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rephase-ios-runtime/
          if-no-files-found: warn
          retention-days: 14
      - name: Record public native dependency locks
        if: always()
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('ios/Podfile.lock')]
          for workspace in ['ios/Runner.xcodeproj', 'ios/Runner.xcworkspace']:
              paths.extend(Path(workspace).rglob('Package.resolved'))
          for path in paths:
              if path.is_file():
                  print(f'REPHASE_NATIVE_LOCK_BEGIN {path}', flush=True)
                  print(path.read_text(), end='', flush=True)
                  print(f'\nREPHASE_NATIVE_LOCK_END {path}', flush=True)
          PY
      - name: Preserve resolved native dependency versions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rephase-ios-dependency-locks-${{ github.sha }}
          path: |
            mobile/ios/Podfile.lock
            mobile/ios/**/Package.resolved
          if-no-files-found: ignore
          retention-days: 14

# No Cloudflare, flight-provider, Google OAuth or signing secrets are supplied.
