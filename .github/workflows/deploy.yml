name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # Automatic pushes are disabled until the owner sets DEPLOY_ENABLED=true.
    # Manual runs deploy main only; an optional production approval can protect both.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      FLIGHT_DAILY_LIMIT: ${{ vars.FLIGHT_DAILY_LIMIT }}
      FLIGHT_MONTHLY_LIMIT: ${{ vars.FLIGHT_MONTHLY_LIMIT }}
      FLIGHT_GLOBAL_MONTHLY_LIMIT: ${{ vars.FLIGHT_GLOBAL_MONTHLY_LIMIT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate target configuration before any remote change
        run: node scripts/check-deploy-config.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Migrate D1, deploy Worker and install configured secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          node --input-type=module -e 'if (!process.env.CLOUDFLARE_API_TOKEN?.trim()) { console.error("Set the CLOUDFLARE_API_TOKEN environment secret before deploying."); process.exit(1); }'
          npm run deploy -- --apply
