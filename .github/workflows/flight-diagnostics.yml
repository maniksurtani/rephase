name: Flight diagnostics

on:
  workflow_dispatch:
    inputs:
      check_provider:
        description: 'Make one AeroDataBox request (normally two provider units)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Inspect application allowance counters without account identifiers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FLIGHT_DAILY_LIMIT: ${{ vars.FLIGHT_DAILY_LIMIT }}
          FLIGHT_MONTHLY_LIMIT: ${{ vars.FLIGHT_MONTHLY_LIMIT }}
          FLIGHT_GLOBAL_MONTHLY_LIMIT: ${{ vars.FLIGHT_GLOBAL_MONTHLY_LIMIT }}
        run: node scripts/check-flight-provider.mjs --usage
      - name: Check subscribed provider credentials with one request
        if: inputs.check_provider
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/check-flight-provider.mjs --provider
