name: Publish iOS beta

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate: unsigned archive; build: signed IPA; upload: TestFlight; distribute: assign an existing build'
        required: true
        default: build
        type: choice
        options: [build, upload, validate, distribute]
      version:
        description: Marketing version (major.minor.patch)
        required: true
        default: '0.1.0'
        type: string

      release_notes:
        description: What should external testers try?
        type: string
        default: Please test trip planning, Google sign-in, lounge access and reminders.
      existing_build:
        description: Existing build number for distribute mode (no rebuild or upload).
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-beta
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.mode != 'distribute'
    uses: ./.github/workflows/mobile-release-prepare.yml
    permissions:
      contents: read
      actions: write

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.mode != 'distribute'
    runs-on: macos-15
    timeout-minutes: 70
    environment: ios-beta
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      IOS_MODE: ${{ inputs.mode }}
      IOS_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate settings and prepare temporary files
        run: python3 scripts/prepare-ios-beta.py
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
      - name: Install and validate the signing identity and profile
        if: inputs.mode != 'validate'
        run: bash scripts/install-ios-signing.sh
        env:
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Download the verified mobile engine
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/mobile
          merge-multiple: true
      - name: Verify and install the exact-commit engine
        run: node scripts/mobile-artifact.mjs install
        env:
          RELEASE_RUN_ID: ${{ needs.prepare.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ needs.prepare.outputs.run_attempt }}
      - name: Check the external TestFlight group before compiling
        if: inputs.mode == 'upload'
        run: node scripts/testflight.mjs preflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - uses: ./.github/actions/setup-flutter
        with:
          profile: ios
      - uses: ./.github/actions/setup-ios
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Build the unsigned iOS archive
        working-directory: mobile
        # Pub regenerates release-only plugin registrations; do not use --no-pub.
        # Flutter installs Pods after doing that, excluding dev-only integration_test.
        run: |
          flutter build ipa --release --no-codesign \
            --build-name="$IOS_VERSION" --build-number="$BETA_BUILD_NUMBER" \
            --dart-define-from-file=config.json
          git diff --exit-code -- pubspec.lock
      - name: Verify archive identity, version and icons
        run: python3 scripts/verify-ios-beta.py --archive
      - name: Sign and export the App Store IPA
        if: inputs.mode != 'validate'
        working-directory: mobile
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/rephase-ios-beta/ExportOptions.plist"
      - name: Verify the exported app and signature
        if: inputs.mode != 'validate'
        id: ipa
        run: python3 scripts/verify-ios-beta.py
      - name: Require successful CI before publishing
        timeout-minutes: 35
        run: node scripts/mobile-ci.mjs gate ios
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKS_RUN_ID: ${{ needs.prepare.outputs.checks_run_id }}
          MOBILE_RUN_ID: ${{ needs.prepare.outputs.run_id }}
          NATIVE_RUN_ID: ${{ needs.prepare.outputs.native_run_id }}
      - name: Upload to App Store Connect
        if: inputs.mode == 'upload'
        timeout-minutes: 25
        run: bash scripts/upload-testflight.sh
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - name: Remove signing files and restore the keychain search list
        if: always()
        run: python3 scripts/prepare-ios-beta.py --cleanup

  distribute:
    needs: publish
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      ((inputs.mode == 'upload' && needs.publish.result == 'success') || inputs.mode == 'distribute')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ios-beta
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Assign the processed build to friends-family and submit beta review if needed
        run: node scripts/testflight.mjs distribute
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_VERSION: ${{ inputs.version }}
          BETA_BUILD_NUMBER: ${{ inputs.mode == 'upload' && github.run_number || inputs.existing_build }}
          TESTFLIGHT_RELEASE_NOTES: ${{ inputs.release_notes }}

# Follows maniksurtani/zerocal's manual unsigned-archive -> signed-export ->
# altool upload flow. Rephase is public: no IPA/archive artifacts are uploaded.
# Apple processing/group assignment uses Linux without an IPA artifact or a second build.
