name: Publish iOS beta

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: What should testers try? Published as TestFlight What to Test.
        required: true
        default: Please try trip planning, Google sign-in, lounge access and reminders.
        type: string

permissions:
  contents: read

concurrency:
  group: ios-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-beta
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate configuration and install the provisioning profile
        run: python3 scripts/prepare-ios-beta.py
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
      - name: Import the distribution certificate into a temporary keychain
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify and bundle the offline planner
        run: node scripts/check-mobile-engine.mjs
      - uses: ./.github/actions/setup-flutter
        with:
          profile: ios
      - name: Record the Xcode version
        run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Check Flutter code
        working-directory: mobile
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Archive and export the signed app
        working-directory: mobile
        # Pub regenerates the release plugin registrations; do not use --no-pub.
        run: |
          flutter build ipa --release --build-number="$BETA_BUILD_NUMBER" \
            --dart-define-from-file=config.json \
            --export-options-plist="$RUNNER_TEMP/rephase-ios-beta/ExportOptions.plist"
          git diff --exit-code -- pubspec.lock
      - name: Verify the exported identity and record the IPA checksum
        id: ipa
        run: |
          codesign --verify --deep --strict mobile/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          python3 scripts/verify-ios-beta.py
      - name: Upload to TestFlight and attach release notes
        timeout-minutes: 25
        uses: apple-actions/upload-testflight-build@665328adbecbc3ad929d3da710696d928b8a7ba9 # v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          wait-for-processing: 'true'
          groups: ${{ vars.TESTFLIGHT_GROUPS }}
      - name: Remove signing files and the temporary keychain
        if: always()
        run: |
          python3 scripts/prepare-ios-beta.py --cleanup
          security delete-keychain signing_temp.keychain || true

# No push trigger and no public IPA artifacts. External groups require Apple's
# beta review; uploading does not publish the app on the public App Store.
