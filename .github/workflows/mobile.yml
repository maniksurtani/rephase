name: Mobile checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'public/data-licenses/**'
      - 'scripts/mobile.mjs'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'scripts/run-ios-runtime-test.mjs'
      - 'tests/ios-runtime-runner.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-runtime.yml'
      - '.github/actions/setup-flutter/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'public/data-licenses/**'
      - 'scripts/mobile.mjs'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'scripts/run-ios-runtime-test.mjs'
      - 'tests/ios-runtime-runner.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-runtime.yml'
      - '.github/actions/setup-flutter/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-mobile-engine.mjs
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        working-directory: mobile
      - run: flutter analyze --no-pub
        working-directory: mobile
      - run: flutter test --no-pub
        working-directory: mobile

# Native builds and device tests live in mobile-runtime.yml. Ordinary widget
# changes receive fast feedback without installing Android or iOS toolchains.
