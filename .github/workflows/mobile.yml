name: Mobile checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  FLUTTER_REVISION: 'abaf9c523780a608bd46686fd5e53740a07077f8'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the offline planning bundle in a browser
        run: node scripts/check-mobile-engine.mjs
      - name: Install the pinned official Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-sdk/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter-sdk/bin/flutter" --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - name: Build an installable debug APK
        run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rephase-android-debug-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    # Standard macOS runners are free for this public repository. Build and run
    # the offline native engine test without provisioning, signing or publishing.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-mobile-engine.mjs
      - name: Install the pinned official Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/flutter-sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter-sdk/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter-sdk/bin/flutter" --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Start an available iPhone simulator
        timeout-minutes: 2
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = [device for runtime, group in json.load(sys.stdin)["devices"].items()
                     if ".iOS-" in runtime for device in group
                     if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed")
          selected = next((device for device in devices if device["state"] == "Booted"), devices[0])
          print(selected["udid"])
          ')
          echo "REPHASE_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          # First boot migrates the runner's fresh simulator data. Overlap it with
          # compilation rather than spending the readiness budget on migration.
          xcrun simctl boot "$device_id" || xcrun simctl list devices booted | grep -F "$device_id"
          open -a Simulator --args -CurrentDeviceUDID "$device_id"
      - name: Compile iOS for the simulator without signing
        run: flutter build ios --simulator --debug --no-codesign
        working-directory: mobile
      - name: Wait for the iPhone simulator to finish booting
        timeout-minutes: 5
        run: |
          xcrun simctl bootstatus "$REPHASE_SIMULATOR_ID" -b
      - name: Verify the offline engine in WKWebView
        timeout-minutes: 10
        run: |
          # The official driver reports every integration assertion without
          # flutter test's DDS-dependent golden-file listener (no goldens here).
          flutter drive --no-dds --verbose --driver=test_driver/integration_test.dart --target=integration_test/offline_engine_test.dart -d "$REPHASE_SIMULATOR_ID" > "$RUNNER_TEMP/rephase-ios-integration.log" 2>&1
          tail -n 25 "$RUNNER_TEMP/rephase-ios-integration.log"
        working-directory: mobile
      - name: Diagnose a failed simulator run
        if: failure()
        timeout-minutes: 2
        working-directory: mobile
        run: |
          if [ -f "$RUNNER_TEMP/rephase-ios-integration.log" ]; then
            tail -n 200 "$RUNNER_TEMP/rephase-ios-integration.log"
          fi
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          roots = [Path.home() / 'Library/Logs/DiagnosticReports']
          device = os.environ.get('REPHASE_SIMULATOR_ID')
          try:
              result = subprocess.run(['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], capture_output=True, text=True, timeout=15, check=True)
              devices = [item for group in json.loads(result.stdout)['devices'].values() for item in group]
              selected = next((item for item in devices if item['udid'] == device), None)
              print(f'Simulator state: {selected}', flush=True)
              if selected and selected['state'] == 'Booted':
                  logs = subprocess.run(['xcrun', 'simctl', 'spawn', device, 'log', 'show', '--last', '5m', '--style', 'compact', '--predicate', 'process == "Runner"'], capture_output=True, text=True, timeout=30)
                  print('\n'.join((logs.stdout + logs.stderr).splitlines()[-100:]))
          except (subprocess.SubprocessError, ValueError) as error:
              print(f'Bounded simulator diagnostics: {error}')
          simulator_log = Path.home() / 'Library/Logs/CoreSimulator/CoreSimulator.log'
          if simulator_log.is_file():
              print(simulator_log.read_text(errors='replace')[-12000:])
          if device:
              roots.append(Path.home() / f'Library/Developer/CoreSimulator/Devices/{device}/data/Library/Logs/CrashReporter')
          reports = [path for root in roots for pattern in ['Runner*.ips', 'Runner*.crash'] for path in root.glob(pattern)]
          reports.sort(key=lambda path: path.stat().st_mtime, reverse=True)
          if reports:
              print(f'Latest simulator crash report: {reports[0].name}')
              print(reports[0].read_text(errors='replace')[:16000])
          else:
              print('No Runner crash report was produced.')
          PY
      - name: Record public native dependency locks
        if: always()
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('ios/Podfile.lock')]
          for workspace in ['ios/Runner.xcodeproj', 'ios/Runner.xcworkspace']:
              paths.extend(Path(workspace).rglob('Package.resolved'))
          for path in paths:
              if path.is_file():
                  print(f'REPHASE_NATIVE_LOCK_BEGIN {path}', flush=True)
                  print(path.read_text(), end='', flush=True)
                  print(f'\nREPHASE_NATIVE_LOCK_END {path}', flush=True)
          PY
      - name: Preserve resolved native dependency versions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rephase-ios-dependency-locks-${{ github.sha }}
          path: |
            mobile/ios/Podfile.lock
            mobile/ios/**/Package.resolved
          if-no-files-found: ignore
          retention-days: 14

# No Cloudflare, flight-provider, Google OAuth or signing secrets are supplied.
