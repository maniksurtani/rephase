name: Mobile checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'public/data-licenses/**'
      - 'scripts/mobile.mjs'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/lounge-assets.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'scripts/run-ios-runtime-test.mjs'
      - 'scripts/prepare-ios-beta.py'
      - 'scripts/verify-ios-beta.py'
      - 'scripts/install-ios-signing.sh'
      - 'scripts/upload-testflight.sh'
      - 'scripts/testflight.mjs'
      - 'scripts/mobile-ci.mjs'
      - 'scripts/mobile-artifact.mjs'
      - 'scripts/select-release.mjs'
      - 'scripts/release-artifact.mjs'
      - 'tests/mobile-release.test.ts'
      - 'tests/testflight.test.ts'
      - '.github/workflows/mobile-release-prepare.yml'
      - '.github/workflows/android-beta.yml'
      - '.github/actions/setup-ios/**'
      - 'tests/ios_beta_test.py'
      - '.github/workflows/ios-beta.yml'
      - 'tests/ios-runtime-runner.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-runtime.yml'
      - '.github/actions/setup-flutter/**'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/lib/**'
      - 'src/mobile/**'
      - 'src/data/**'
      - 'data/**'
      - 'public/icon-512.png'
      - 'public/data-licenses/**'
      - 'scripts/mobile.mjs'
      - 'scripts/build-mobile-engine.mjs'
      - 'scripts/lounge-assets.mjs'
      - 'scripts/check-mobile-engine.mjs'
      - 'scripts/run-ios-runtime-test.mjs'
      - 'scripts/prepare-ios-beta.py'
      - 'scripts/verify-ios-beta.py'
      - 'scripts/install-ios-signing.sh'
      - 'scripts/upload-testflight.sh'
      - 'scripts/testflight.mjs'
      - 'scripts/mobile-ci.mjs'
      - 'scripts/mobile-artifact.mjs'
      - 'scripts/select-release.mjs'
      - 'scripts/release-artifact.mjs'
      - 'tests/mobile-release.test.ts'
      - 'tests/testflight.test.ts'
      - '.github/workflows/mobile-release-prepare.yml'
      - '.github/workflows/android-beta.yml'
      - '.github/actions/setup-ios/**'
      - 'tests/ios_beta_test.py'
      - '.github/workflows/ios-beta.yml'
      - 'tests/ios-runtime-runner.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/mobile-runtime.yml'
      - '.github/actions/setup-flutter/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check iOS distribution preparation
        run: |
          python3 -m unittest discover -s tests -p ios_beta_test.py
          bash -n scripts/install-ios-signing.sh
          bash -n scripts/upload-testflight.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify and bundle the shared offline planner once
        run: node scripts/check-mobile-engine.mjs
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
        working-directory: mobile
      - run: flutter analyze --no-pub
        working-directory: mobile
      - run: flutter test --no-pub
        working-directory: mobile

      - name: Prepare verified mobile assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/mobile-artifact.mjs create
      - name: Publish the verified mobile engine for this commit and attempt
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-mobile-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/mobile/
          if-no-files-found: error
          retention-days: 30

# Native builds and device tests live in mobile-runtime.yml. Ordinary widget
# changes receive fast feedback without installing Android or iOS toolchains.
